<style>

  }
  .ic{width:1.05em;height:1.05em;vertical-align:-0.16em;flex:none}
  .hr-strip{
    width:100%;max-width:900px;display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:11px 18px;
    background:rgba(255,255,255,.7);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--line);border-radius:980px;font-size:14px;color:var(--muted);box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .hr-strip b{color:var(--ink);font-weight:600}
  .hr-strip .spacer{flex:1}
  .btn{appearance:none;border:0;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:500;padding:8px 16px;border-radius:980px;background:var(--accent);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .12s ease, background .2s ease}
  .btn:hover{background:#0077ed}
  .btn:active{transform:scale(.97)}
  .window{width:100%;max-width:900px;background:var(--win);border-radius:var(--radius);border:1px solid rgba(0,0,0,.06);box-shadow:0 30px 60px -20px rgba(0,0,0,.22),0 12px 24px -16px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column;min-height:560px;max-height:min(80vh,780px);max-height:min(80dvh,780px)}
  .titlebar{display:flex;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(180deg,#f6f6f8,#ececef);border-bottom:1px solid var(--line);user-select:none}
  .dots{display:flex;gap:8px}
  .dot{width:12px;height:12px;border-radius:50%}
  .dot.r{background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
  .dot.y{background:#febc2e;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
  .dot.g{background:#28c840;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
  .title{flex:1;text-align:center;font-size:13px;color:var(--faint);font-family:var(--mono);letter-spacing:.2px;margin-right:60px}
  .chips{display:flex;gap:6px}
  .chip{font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none;padding:3px 9px;border-radius:7px;background:#fff;border:1px solid var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:all .15s ease}
  .chip:hover{color:var(--accent-ink);border-color:#cfe3fb;background:#f3f8ff}
  .screen{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:22px clamp(16px,4vw,30px) 8px;font-family:var(--mono);font-size:14px;line-height:1.65;color:var(--ink);scroll-behavior:smooth}
  .screen::-webkit-scrollbar{width:10px}
  .screen::-webkit-scrollbar-thumb{background:#d6d6db;border-radius:10px;border:3px solid var(--win)}
  .muted{color:var(--muted)}.faint{color:var(--faint)}.green{color:var(--green)}.pink{color:var(--pink)}.accent{color:var(--accent-ink)}.b{font-weight:600}
  a.link{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid rgba(10,132,255,.25)}
  a.link:hover{border-bottom-color:var(--accent-ink)}
  .row{white-space:pre-wrap;word-break:break-word}
  .block{margin:6px 0 14px}
  .hero{display:flex;gap:22px;flex-wrap:wrap;align-items:center;padding:6px 0 12px}
  .hero .name{font-family:var(--sans);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .hero .sub{font-family:var(--sans);color:var(--muted);font-size:15px;margin-top:4px}
  .grid{display:grid;grid-template-columns:auto 1fr;gap:3px 18px;font-size:13px}
  .grid .k{color:var(--green);font-weight:600}
  .grid .v{color:var(--ink)}
  .cmds{display:grid;grid-template-columns:max-content 1fr;gap:4px 22px}
  .cmds .c{color:var(--accent-ink);font-weight:600}
  .cmds .d{color:var(--muted)}

  .card{font-family:var(--sans);border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:#fcfcfd;transition:border-color .15s ease, box-shadow .15s ease}
  .card:hover{border-color:#d7e6fb;box-shadow:0 6px 18px -10px rgba(0,0,0,.18)}
  .card .h{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .pic{width:30px;height:30px;border-radius:8px;background:#eef3fb;color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;flex:none}
  .pic .ic{width:17px;height:17px;vertical-align:0}
  .card .pname{font-size:16px;font-weight:650;letter-spacing:-.01em;flex:1;min-width:120px}
  .card .tag{font-size:11px;color:var(--muted);background:#f0f0f3;border-radius:6px;padding:2px 8px}
  .card .pdesc{color:var(--muted);font-size:13.5px;line-height:1.55;margin:9px 0 10px}
  .card .stack{display:flex;flex-wrap:wrap;gap:6px}
  .card .st{font-family:var(--mono);font-size:11px;color:#3a3a3c;background:#eef1f4;border-radius:6px;padding:3px 8px}
  .card .plink{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
  .chiprow{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}
  .quick{font-family:var(--mono);font-size:12px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:4px 10px;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:all .14s ease}
  .quick:hover{color:var(--accent-ink);border-color:#cfe3fb;background:#f3f8ff}
  .inputline{display:flex;align-items:center;gap:0;padding:4px 0 20px}
  .ps1{color:var(--prompt);font-weight:600;white-space:nowrap}
  .ps1 .at{color:var(--muted);font-weight:500}
  .ps1 .path{color:var(--accent-ink)}
  #cmd{flex:1;min-width:40px;border:0;outline:0;background:transparent;font-family:var(--mono);font-size:14px;color:var(--ink);padding:0 0 0 8px;caret-color:var(--accent)}
  .foot{text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono);margin-top:14px}
  .foot a{color:var(--faint)}
  @media (max-width:560px){ .title{display:none} .hero .name{font-size:24px} .screen{font-size:13px} .hr-strip{flex-wrap:wrap;border-radius:18px} }
  @media (hover: none){
    .btn:hover{background:var(--accent)}
    .chip:hover,.quick:hover{color:var(--muted);border-color:var(--line);background:#fff}
    .card:hover{border-color:var(--line);box-shadow:none}
    a.link:hover{border-bottom-color:rgba(10,132,255,.25)}
    .chip:active,.quick:active{background:#eef3fb;border-color:#cfe3fb}
  }
  @media (pointer: coarse){ #cmd{font-size:16px} }
  @media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto !important} .btn:active{transform:none} }
</style>
</head>

      + '<div class="row"><span class="b">'+esc(ME.name)+'</span> — '+esc(ME.role)+'</div>'
      + '<div class="row" style="margin-top:8px">'+esc(ME.tagline)+'</div>'
      + '<div class="row muted" style="margin-top:8px">I work directly with clients: I co-founded Otto Studio (a software house for AI automation and custom software) and I am lead developer of a B2B SaaS. I built QuadraJet end to end — a fraud-analysis system used by ~150 people across 30 offices — including the company server it runs on and its three-level security. I also run a self-built home server that hosts my main projects.</div>'
      + '<div class="row muted" style="margin-top:8px">Hands-on with AI — Claude, Cursor and local models (Ollama, multi-agent tooling) — alongside TypeScript/Node.js, PostgreSQL and REST APIs. Security and GDPR as defaults, not afterthoughts. Native Italian and Romanian, English B2. Studying Cybersecurity and AI at the University of Milan.</div>'
      + quickRow(["projects","experience","skills","contact"]));
  }

  function cardHTML(p){
    var stack = p.stack.map(function(s){ return '<span class="st">'+esc(s)+'</span>'; }).join("");
    var linkHTML = p.link
      ? '<div class="plink"><a class="link" href="'+esc(p.link)+'" target="_blank" rel="noopener">'+esc(p.linkLabel)+' '+ic("link")+'</a>'+(p.linkNote?' <span class="faint">· '+esc(p.linkNote)+'</span>':'')+'</div>'
      : '<div class="plink faint">— private project / no public link</div>';
    return '<div class="card"><div class="h"><span class="pic">'+ic(p.icon)+'</span><span class="pname">'+esc(p.name)+'</span><span class="tag">'+esc(p.tag)+'</span></div><div class="pdesc">'+esc(p.desc)+'</div><div class="stack">'+stack+'</div>'+linkHTML+'</div>';
  }
  function renderProjects(){
    var h = '<div class="row b" style="margin-bottom:6px">Projects</div><div class="row faint" style="margin-bottom:10px">'+PROJECTS.length+' projects · type <span class="accent">open &lt;name&gt;</span> to open one</div><div class="cards">';
    PROJECTS.forEach(function(p){ h += cardHTML(p); });
    out(h+'</div>');
  }
  function renderOpen(arg){
    var p = PROJECTS.filter(function(x){ return x.key===arg || x.name.toLowerCase().indexOf(arg)>-1; })[0];
    if(!p){ out(line('<span class="pink">open:</span> project "'+esc(arg)+'" not found. Try <span class="accent">projects</span>.')); return; }
    out('<div class="cards">'+cardHTML(p)+'</div>');
  }
  function renderLs(){
    var names = PROJECTS.map(function(p){ return '<span class="accent">'+esc(p.key)+'</span>'; }).join("   ");
    out(line(names)+'<div class="row faint" style="margin-top:6px">use <span class="accent">open &lt;name&gt;</span></div>');
  }
  function renderSkills(){
    var h = '<div class="row b" style="margin-bottom:8px">Skills</div>';
    Object.keys(SKILLS).forEach(function(g){
      var items = SKILLS[g].map(function(s){ return '<span class="st">'+esc(s)+'</span>'; }).join("");
      h += '<div class="row" style="margin:6px 0"><span class="green b">'+esc(g)+'</span><div class="stack" style="margin-top:5px">'+items+'</div></div>';
    });
    out(h);
  }
  function renderExperience(){
    var h = '<div class="row b" style="margin-bottom:8px">Experience</div>';
    EXPERIENCE.forEach(function(e){
      h += '<div style="margin:0 0 12px"><div class="row"><span class="b">'+esc(e.role)+'</span> <span class="muted">· '+esc(e.org)+'</span>'+(e.when?' <span class="faint">· '+esc(e.when)+'</span>':'')+'</div>';
      e.bullets.forEach(function(b){ h += '<div class="row muted">• '+esc(b)+'</div>'; });
      h += '</div>';
    });
    out(h+'<div class="row faint">Full detail, education and certifications in the <a class="link" href="cv.html">CV →</a></div>');
  }
  function renderContact(){
    out(''
      + '<div class="cmds">'
      +   '<div class="c">'+ic("mail")+' Email</div><div class="d"><a class="link" href="mailto:'+esc(EMAIL)+'">'+esc(EMAIL)+'</a></div>'
      +   '<div class="c">'+ic("phone")+' Phone</div><div class="d"><a class="link" href="tel:'+esc(PHONE.replace(/\s/g,""))+'">'+esc(PHONE)+'</a></div>'
      +   '<div class="c">'+ic("github")+' GitHub</div><div class="d"><a class="link" href="'+esc(GITHUB)+'" target="_blank" rel="noopener">github.com/rub3nino '+ic("link")+'</a></div>'
      +   '<div class="c">'+ic("linkedin")+' LinkedIn</div><div class="d"><a class="link" href="'+esc(LINKEDIN)+'" target="_blank" rel="noopener">Ruben Havrestiuc '+ic("link")+'</a></div>'
      +   '<div class="c">'+ic("terminal")+' CV</div><div class="d"><a class="link" href="cv.html">Open the CV →</a></div>'
      + '</div>');
  }

  var COMMANDS = {
    help: renderHelp, about: renderAbout, whoami: renderAbout,
    projects: renderProjects, work: renderProjects,
    skills: renderSkills, experience: renderExperience, contact: renderContact, ls: renderLs,
    open: function(arg){ if(!arg){ out(line('<span class="pink">open:</span> specify a project, e.g. <span class="accent">open tiivo</span>')); } else { renderOpen(arg); } },
    cv: function(){ out(line('Opening the CV…')); setTimeout(function(){ location.href="cv.html"; },250); },
    github: function(){ out(line('Opening GitHub…')); window.open(GITHUB,"_blank","noopener"); },
    linkedin: function(){ out(line('Opening LinkedIn…')); window.open(LINKEDIN,"_blank","noopener"); },
    clear: function(){ document.querySelectorAll(".screen .block").forEach(function(b){ b.remove(); }); },
    date: function(){ out(line('<span class="muted">'+esc(new Date().toString())+'</span>')); },
    echo: function(arg){ out(line(esc(arg||""))); },
    pwd: function(){ out(line('<span class="muted">/home/ruben/portfolio</span>')); }
  };
  var CMD_NAMES = Object.keys(COMMANDS).concat(["quadra","tiivo","consentinel","bizzy","frames","steelyes","ebenezer"]);

  function run(raw){
    var cmd = raw.trim();
    if(cmd===""){ out(line(prompt())); return; }
    echoCommand(cmd); history.push(cmd); hIdx = history.length;
    var parts = cmd.split(/\s+/), name = parts[0].toLowerCase(), arg = parts.slice(1).join(" ").toLowerCase();
    if(COMMANDS[name]){ COMMANDS[name](arg); }
    else if(PROJECTS.some(function(p){ return p.key===name; })){ renderOpen(name); }
    else { out(line('<span class="pink">zsh:</span> command not found: <span class="b">'+esc(name)+'</span>. Type <span class="accent">help</span>.')); }
  }

  function mountInput(){
    var wrap=document.createElement("div"); wrap.className="inputline"; wrap.innerHTML=prompt();
    var inp=document.createElement("input"); inp.id="cmd"; inp.autocomplete="off"; inp.autocapitalize="off"; inp.spellcheck=false; inp.setAttribute("aria-label","Terminal command");
    wrap.appendChild(inp); screen.appendChild(wrap); inputEl=inp;
    inp.addEventListener("keydown", function(e){
      if(e.key==="Enter"){ var v=inp.value; inp.value=""; run(v); scrollDown(); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); if(hIdx>0){ hIdx--; inp.value=history[hIdx]||""; } }
      else if(e.key==="ArrowDown"){ e.preventDefault(); if(hIdx<history.length-1){ hIdx++; inp.value=history[hIdx]||""; } else { hIdx=history.length; inp.value=""; } }
      else if(e.key==="Tab"){ e.preventDefault(); var cur=inp.value.trim().toLowerCase(); if(cur){ var m=CMD_NAMES.filter(function(c){ return c.indexOf(cur)===0; }); if(m.length===1){ inp.value=m[0]+" "; } else if(m.length>1){ out(line('<span class="faint">'+m.join("   ")+'</span>')); } } }
      else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="l"){ e.preventDefault(); COMMANDS.clear(); }
    });
  }
  function focusInput(){ if(inputEl){ inputEl.focus(); } }

  document.addEventListener("click", function(e){
    var q=e.target.closest("[data-cmd]");
    if(q){ var c=q.getAttribute("data-cmd"); if(inputEl){ inputEl.value=""; } run(c); scrollDown(); focusInput(); return; }
    if(e.target.closest("a")) return;
    if(e.target.closest(".window")){ focusInput(); }
  });

  var bootLines = [
    '<span class="faint">ruben-portfolio · booting…</span>',
    '<span class="faint">loading projects ............. <span class="green">ok</span></span>',
    '<span class="faint">connection established ........ <span class="green">ok</span></span>'
  ];
  var bi=0;
  function boot(){ if(bi<bootLines.length){ out(line(bootLines[bi])); bi++; setTimeout(boot,180); } else { mountInput(); renderWelcome(); focusInput(); } }
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    bootLines.forEach(function(l){ out(line(l)); }); mountInput(); renderWelcome(); focusInput();
  } else { boot(); }
})();
</script>
</body>
</html>
